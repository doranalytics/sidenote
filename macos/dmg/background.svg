<svg xmlns="http://www.w3.org/2000/svg" width="640" height="400" viewBox="0 0 640 400">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f2f2f5"/>
    </linearGradient>
    <marker id="head" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0a84ff"/>
    </marker>
  </defs>
  <rect width="640" height="400" fill="url(#g)"/>
  <text x="320" y="72" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial" font-size="21" font-weight="600" fill="#1d1d1f">Drag Sidenote into Applications</text>
  <text x="320" y="100" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial" font-size="13" fill="#86868b">Then open it from there — not from this window.</text>
  <line x1="258" y1="196" x2="392" y2="196" stroke="#0a84ff" stroke-width="3" stroke-linecap="round" marker-end="url(#head)"/>
  <text x="320" y="330" text-anchor="middle" font-family="-apple-system, SF Pro Text, Helvetica Neue, Arial" font-size="12" fill="#86868b">Sidenote updates itself from here on.</text>
</svg>
